[package]
name = "warlock-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# No TUI, terminal, HTTP or Anthropic dependency belongs here: the dependency
# edge runs TUI -> engine and never back.
[dependencies]
serde = { workspace = true, features = ["derive"] }

# Tests only, and deliberately not a format crate: `serde_test` round-trips a
# value through serde's own tokens, which proves the derives without the crate
# ever naming an on-disk format.
[dev-dependencies]
serde_test = { workspace = true }

# Lint configuration lives in the root manifest so every crate is held to the
# same bar; see `[workspace.lints]` there.
[lints]
workspace = true
