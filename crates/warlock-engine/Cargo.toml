[package]
name = "warlock-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# No TUI, terminal, HTTP or Anthropic dependency belongs here: the dependency
# edge runs TUI -> engine and never back.
[dependencies]
ignore = { workspace = true }
serde = { workspace = true, features = ["derive"] }
toml = { workspace = true }

# Tests only. `serde_test` round-trips a value through serde's own tokens, which
# proves the derives independently of the on-disk format, and `tempfile` gives
# the manifest tests a throwaway directory to save into and load back from.
[dev-dependencies]
serde_test = { workspace = true }
tempfile = { workspace = true }

# Lint configuration lives in the root manifest so every crate is held to the
# same bar; see `[workspace.lints]` there.
[lints]
workspace = true
