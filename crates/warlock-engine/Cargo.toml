[package]
name = "warlock-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# The dependency edge runs TUI -> engine and never back, so no TUI, terminal or
# Anthropic dependency belongs here — and no HTTP client either. The engine
# names a board in `.warlock/pacts.toml` and joins a scope's team and label to a
# machine's key in `route.rs`, but it never talks to anything: `ureq` and the
# Linear vocabulary that uses it live in warlock-tui, where the boundary with
# the outside world already was.
[dependencies]
blake3 = { workspace = true }
ignore = { workspace = true }
serde = { workspace = true, features = ["derive"] }
# The shape a pass fills in is JSON: a fixed object the engine builds, hands
# over, reads back and checks (`document`). The engine owns that contract, so
# it owns the parser for it; the TUI's use of the same crate is for a different
# stream, the CLI's own.
serde_json = { workspace = true }
toml = { workspace = true }

# Tests only. `serde_test` round-trips a value through serde's own tokens, which
# proves the derives independently of the on-disk format, and `tempfile` gives
# the manifest tests a throwaway directory to save into and load back from.
[dev-dependencies]
serde_test = { workspace = true }
tempfile = { workspace = true }

# Lint configuration lives in the root manifest so every crate is held to the
# same bar; see `[workspace.lints]` there.
[lints]
workspace = true
