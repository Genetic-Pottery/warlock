[package]
name = "warlock-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# The crate is warlock-tui; the executable it ships is `warlock`.
[[bin]]
name = "warlock"
path = "src/main.rs"

# Lint configuration lives in the root manifest so every crate is held to the
# same bar; see `[workspace.lints]` there.
[lints]
workspace = true
