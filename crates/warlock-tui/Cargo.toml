[package]
name = "warlock-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# The crate is warlock-tui; the executable it ships is `warlock`.
[[bin]]
name = "warlock"
path = "src/main.rs"

# The pure parts of the front end (state-to-colour, app state) live in the
# library so they are ordinary reachable API that the binary and the tests both
# use; `src/main.rs` is the thin shell around them.
[lib]
name = "warlock_tui"
path = "src/lib.rs"

# The dependency edge runs TUI -> engine: the front end knows the domain
# vocabulary, and the engine knows nothing about terminals.
[dependencies]
clap = { workspace = true }
# Only the headless runs press it into service, and only from `src/running.rs`:
# a `warlock pact` is minutes of model passes with no panel to press Esc in, so
# Ctrl-C is the one say-when a shell has. See the workspace manifest for why the
# job is worth a crate rather than a handler written here.
ctrlc = { workspace = true }
notify = { workspace = true }
ratatui = { workspace = true }
serde_json = { workspace = true }
warlock-engine = { path = "../warlock-engine" }

# Tests only, and already a workspace dependency rather than a new one: the
# `warlock config` tests write a real config file, and a throwaway home
# directory is what keeps them off the developer's real one — which is the
# promise the engine's explicit home parameter exists to make keepable.
[dev-dependencies]
tempfile = { workspace = true }

# Lint configuration lives in the root manifest so every crate is held to the
# same bar; see `[workspace.lints]` there.
[lints]
workspace = true
