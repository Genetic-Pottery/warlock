[workspace]
resolver = "3"
members = ["crates/warlock-engine", "crates/warlock-tui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
repository = "https://github.com/Genetic-Pottery/warlock"

# Prefer std. Any entry added here needs a one-line comment directly above it
# saying why the dependency is worth the supply chain.
[workspace.dependencies]
# Derive-based (de)serialisation: hand-rolling it for every engine type is a lot
# of error-prone boilerplate, and serde is the de facto standard every future
# format crate already speaks. No on-disk format is committed to here.
serde = { version = "1", features = ["derive"] }
# Dev-only: round-trips a value through serde's own token stream, so the derives
# can be tested in memory without pulling in a format crate and accidentally
# committing to an on-disk format.
serde_test = { version = "1" }
