name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache the cargo registry and target directory
        uses: Swatinem/rust-cache@v2

      # `if: always()` on the two below, so one misplaced import cannot end the
      # job before anything has been compiled. A formatting slip is the cheapest
      # failure there is and it was hiding the expensive ones: a run that stops
      # at fmt reports nothing about whether the code builds, lints or passes,
      # which buys a second push to find out.
      - name: cargo fmt --all --check
        run: cargo fmt --all --check

      - name: cargo clippy --workspace --all-targets -- -D warnings
        if: always()
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test --workspace
        if: always()
        run: cargo test --workspace
