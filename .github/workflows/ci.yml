name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: fmt, clippy, test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # Pinned to the workspace's `rust-version`. `stable` moved to a release
      # whose new clippy lints and deprecations failed every branch while the
      # same code passed locally, and the fix for one of them does not compile
      # on the pinned toolchain. Move this and `rust-version` together.
      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Cache the cargo registry and target directory
        uses: Swatinem/rust-cache@v2

      # `if: always()` on the two below, so one misplaced import cannot end the
      # job before anything has been compiled. A formatting slip is the cheapest
      # failure there is and it was hiding the expensive ones: a run that stops
      # at fmt reports nothing about whether the code builds, lints or passes,
      # which buys a second push to find out.
      - name: cargo fmt --all --check
        run: cargo fmt --all --check

      - name: cargo clippy --workspace --all-targets -- -D warnings
        if: always()
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test --workspace
        if: always()
        run: cargo test --workspace
